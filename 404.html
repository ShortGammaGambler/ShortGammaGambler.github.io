<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Page not found — QuantumEdge Alpha</title>
<meta name="robots" content="noindex,follow" />
<meta name="theme-color" content="#0A2540" />
<link rel="icon" href="/assets/brand/mark.svg" type="image/svg+xml" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#0A2540;--green:#1FBF75;--slate:#5B6B80;--bg:#F1F6FC;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:40px 24px;
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:var(--ink);
    background:radial-gradient(46% 38% at 78% 6%,rgba(52,211,153,.22),transparent 70%),
               radial-gradient(40% 34% at 10% 0%,rgba(57,199,232,.18),transparent 72%),
               linear-gradient(180deg,#F6FAFF 0%,var(--bg) 60%,#E3EEF9 100%);}
  .card{width:100%;max-width:620px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.7);
    border-radius:26px;padding:44px 40px;box-shadow:0 24px 60px rgba(10,37,64,.12);text-align:center;
    backdrop-filter:blur(14px) saturate(150%)}
  .mark{width:46px;height:46px;margin:0 auto 22px}
  .code{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:#12A566;background:rgba(31,191,117,.10);border:1px solid rgba(31,191,117,.24);
    border-radius:999px;padding:7px 14px;display:inline-block;margin-bottom:20px}
  h1{font-size:clamp(26px,4.6vw,36px);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px}
  p{margin:0 0 26px;color:var(--slate);font-size:15.5px;line-height:1.7}
  .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  a.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;border-radius:999px;
    padding:14px 26px;text-decoration:none;transition:transform .18s ease,box-shadow .22s ease}
  a.primary{color:#fff;background:linear-gradient(100deg,#34D399,#1FBF75 55%,#12A566);
    box-shadow:0 10px 26px rgba(31,191,117,.32)}
  a.ghost{color:var(--ink);background:#fff;border:1px solid rgba(10,37,64,.10);box-shadow:0 8px 22px rgba(10,37,64,.08)}
  a.btn:hover{transform:translateY(-1px)}
  .links{margin-top:26px;padding-top:18px;border-top:1px solid rgba(10,37,64,.10);
    display:flex;gap:18px;justify-content:center;flex-wrap:wrap;
    font-family:'JetBrains Mono',monospace;font-size:11px}
  .links a{color:#00A87A;text-decoration:none}
  .links a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="card">
    <img class="mark" src="/assets/brand/mark.svg" alt="" width="46" height="46" />
    <div class="code">Error 404</div>
    <h1>This page isn't in the model.</h1>
    <p>The address you followed doesn't exist on quantumedgealpha.com. Head back to the homepage, or jump straight into the analytics workspace.</p>
    <div class="btns">
      <a class="btn primary" href="/">Back to homepage</a>
      <a class="btn ghost" href="/app.html">Open the app</a>
    </div>
    <div class="links">      <a href="/terms.html">Terms of Service</a>
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/risk-disclosure.html">Full Risk Disclosure</a>
    </div>
  </main>
</body>
</html>
